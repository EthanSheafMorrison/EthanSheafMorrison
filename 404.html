<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Ethan Sheaf-Morrison</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .notfound {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            gap: 1.5rem;
        }
        .notfound-code {
            font-size: clamp(4rem, 14vw, 9rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1;
            margin: 0;
        }
        .notfound-msg {
            font-size: 1.125rem;
            color: #555;
            margin: 0;
            max-width: 32ch;
        }
        .notfound-link {
            display: inline-block;
            margin-top: 0.5rem;
            font-size: 0.75rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #000;
            border-bottom: 1px solid #000;
            padding-bottom: 2px;
            text-decoration: none;
        }
        .notfound-link:hover { opacity: 0.6; }
    </style>
</head>
<body>
    <div id="site-header"></div>
    <main class="notfound">
        <h1 class="notfound-code">404</h1>
        <p class="notfound-msg">The page you're looking for doesn't exist or has been moved.</p>
        <a class="notfound-link" href="/index.html">Return home</a>
    </main>
    <script>
        fetch('header.html')
            .then(res => res.text())
            .then(data => { document.getElementById('site-header').innerHTML = data; });
    </script>
</body>
</html>
