<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap — Ethan Sheaf-Morrison</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .sitemap {
            max-width: 720px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }
        .sitemap h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 600;
            letter-spacing: -0.01em;
            margin: 0 0 0.5rem;
        }
        .sitemap-section {
            margin-top: 3rem;
        }
        .sitemap-section h2 {
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(0, 0, 0, 0.5);
            margin: 0 0 1rem;
            font-weight: 500;
        }
        .sitemap-list {
            list-style: none;
            padding: 0;
            margin: 0;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }
        .sitemap-list li {
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        .sitemap-list a {
            display: block;
            padding: 0.9rem 0;
            color: #000;
            text-decoration: none;
            font-size: 1rem;
        }
        .sitemap-list a:hover {
            opacity: 0.55;
        }
    </style>
</head>
<body>
    <div id="site-header"></div>
    <main class="sitemap">
        <h1>Sitemap</h1>

        <section class="sitemap-section">
            <h2>Pages</h2>
            <ul class="sitemap-list">
                <li><a href="/index.html">Home</a></li>
                <li><a href="/about.html">About</a></li>
                <li><a href="/cv.html">CV</a></li>
                <li><a href="/contact.html">Contact</a></li>
            </ul>
        </section>

        <section class="sitemap-section">
            <h2>Projects</h2>
            <ul class="sitemap-list" id="sitemap-projects"></ul>
        </section>
    </main>
    <script src="projects-data.js"></script>
    <script>
        fetch('header.html')
            .then(res => res.text())
            .then(data => { document.getElementById('site-header').innerHTML = data; });

        const list = document.getElementById('sitemap-projects');
        list.innerHTML = projectsData
            .filter(p => p.visible && !/^https?:\/\//.test(p.url))
            .map(p => `<li><a href="${p.url}">${p.title}</a></li>`)
            .join('');
    </script>
</body>
</html>
